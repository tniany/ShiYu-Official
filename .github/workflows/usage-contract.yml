name: Usage reporting contract

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify legacy-compatible usage reporting
        run: node --test square-worker/test/usage-open.test.mjs

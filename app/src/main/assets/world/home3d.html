<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="color-scheme" content="dark">
  <title>时遇 3D 家园</title>
  <style>
    * { box-sizing: border-box; }
    html, body, #scene { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #9fc6cf; }
    body { font-family: system-ui, sans-serif; }
    canvas { display: block; width: 100%; height: 100%; touch-action: none; }
    #status { position: fixed; inset: 0; display: grid; place-items: center; color: #17333a; font-size: 14px; background: #9fc6cf; }
    #name { position: fixed; left: 18px; bottom: 22px; color: #fff; font-weight: 650; font-size: 15px; text-shadow: 0 1px 5px #18343f; opacity: 0; transition: opacity .3s; }
  </style>
  <script type="importmap">
    {"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.166.1/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.166.1/examples/jsm/"}}
  </script>
</head>
<body>
  <div id="scene"></div>
  <div id="status">正在布置家园...</div>
  <div id="name"></div>
  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    const query = new URLSearchParams(location.search);
    const primary = /^#[0-9a-f]{6}$/i.test(query.get('primary') || '') ? query.get('primary') : '#df7861';
    const secondary = /^#[0-9a-f]{6}$/i.test(query.get('secondary') || '') ? query.get('secondary') : '#f4d8cd';
    const roleName = (query.get('name') || '角色').slice(0, 24);
    const mount = document.getElementById('scene');
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    mount.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#9fc6cf');
    scene.fog = new THREE.Fog('#9fc6cf', 18, 42);
    const camera = new THREE.PerspectiveCamera(44, innerWidth / innerHeight, .1, 90);
    camera.position.set(8.4, 6.7, 10.5);
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.target.set(0, 1.7, 0);
    controls.enableDamping = true;
    controls.minDistance = 5;
    controls.maxDistance = 24;
    controls.maxPolarAngle = Math.PI * .49;

    scene.add(new THREE.HemisphereLight('#fff5dc', '#55706b', 2.25));
    const sun = new THREE.DirectionalLight('#fff1d2', 3.1);
    sun.position.set(-6, 11, 7);
    sun.castShadow = true;
    sun.shadow.mapSize.set(1024, 1024);
    scene.add(sun);

    const mat = (color, roughness=.82) => new THREE.MeshStandardMaterial({ color, roughness, metalness: .03 });
    const box = (name, size, position, color, radius=0) => {
      const mesh = new THREE.Mesh(new THREE.BoxGeometry(size[0], size[1], size[2], radius ? 2 : 1, radius ? 2 : 1, radius ? 2 : 1), mat(color));
      mesh.name = name;
      mesh.position.set(position[0], position[1], position[2]);
      mesh.castShadow = true;
      mesh.receiveShadow = true;
      scene.add(mesh);
      return mesh;
    };

    box('floor', [13, .35, 10], [0, -.2, 0], '#d5c6ad');
    box('rug', [5.1, .06, 3.6], [.5, .03, .55], '#668d84');
    box('wall-left', [.24, 5.6, 10], [-6.4, 2.6, 0], '#eee6d8');
    box('wall-back', [13, 5.6, .24], [0, 2.6, -4.9], '#f4eee4');
    box('window', [4.1, 2.35, .08], [1.8, 3.3, -4.72], '#6ea8b5');
    box('window-cross-v', [.08, 2.35, .1], [1.8, 3.3, -4.65], '#e7e2d8');
    box('window-cross-h', [4.1, .08, .1], [1.8, 3.3, -4.65], '#e7e2d8');

    box('sofa-base', [4.1, .65, 1.55], [1.5, .65, -2.45], '#c76f5b');
    box('sofa-back', [4.1, 1.45, .45], [1.5, 1.32, -3.05], '#d47c66');
    box('sofa-arm-l', [.42, 1.02, 1.6], [-.72, .88, -2.45], '#b65d4d');
    box('sofa-arm-r', [.42, 1.02, 1.6], [3.72, .88, -2.45], '#b65d4d');
    box('table-top', [2.7, .16, 1.5], [.55, 1.03, .55], '#7b563d');
    [[-.5,.55,-.05],[1.6,.55,-.05],[-.5,.55,1.15],[1.6,.55,1.15]].forEach((p,i)=>box('table-leg-'+i,[.16,.95,.16],p,'#674631'));
    box('shelf', [1.8, 3.5, .52], [-4.9, 1.75, -3.95], '#315b59');
    for (let i=0;i<4;i++) box('shelf-line-'+i,[1.9,.09,.62],[-4.9,.43+i*.88,-3.62],'#d7be83');
    for (let i=0;i<9;i++) box('book-'+i,[.13+.05*(i%2),.5+.08*(i%3),.35],[-5.55+(i%3)*.48,.75+Math.floor(i/3)*.88,-3.26],['#d95d57','#e0ad55','#426f78'][i%3]);

    const pot = new THREE.Mesh(new THREE.CylinderGeometry(.42,.34,.55,18),mat('#b8614c'));
    pot.position.set(4.85,.3,-3.8);pot.castShadow=true;scene.add(pot);
    const plant = new THREE.Group();plant.position.set(4.85,.78,-3.8);scene.add(plant);
    for(let i=0;i<8;i++){
      const leaf=new THREE.Mesh(new THREE.SphereGeometry(.24,14,10),mat(i%2?'#3b7956':'#4f9366'));
      const a=i*Math.PI*.25;leaf.position.set(Math.cos(a)*.34,.35+(i%3)*.22,Math.sin(a)*.34);leaf.scale.set(.7,1.6,.55);leaf.rotation.z=Math.cos(a)*.45;plant.add(leaf);
    }

    const person = new THREE.Group();person.position.set(-2.15,0,1.35);person.rotation.y=.35;scene.add(person);
    const skin=mat('#f1c3a6');
    const clothing=mat(primary);
    const trim=mat(secondary);
    const hair=mat('#3a2928');
    const body=new THREE.Mesh(new THREE.CapsuleGeometry(.55,1.35,8,16),clothing);body.position.y=1.65;body.castShadow=true;person.add(body);
    const collar=new THREE.Mesh(new THREE.TorusGeometry(.42,.09,8,24),trim);collar.rotation.x=Math.PI/2;collar.position.y=2.36;person.add(collar);
    const head=new THREE.Mesh(new THREE.SphereGeometry(.56,24,18),skin);head.position.y=3.13;head.castShadow=true;person.add(head);
    const hairCap=new THREE.Mesh(new THREE.SphereGeometry(.59,24,18,0,Math.PI*2,0,Math.PI*.56),hair);hairCap.position.y=3.3;hairCap.castShadow=true;person.add(hairCap);
    const makeLimb=(x,rot)=>{const limb=new THREE.Mesh(new THREE.CapsuleGeometry(.14,.9,5,10),clothing);limb.position.set(x,1.72,0);limb.rotation.z=rot;limb.castShadow=true;person.add(limb);return limb};
    const armL=makeLimb(-.68,-.16), armR=makeLimb(.68,.16);
    [-.28,.28].forEach(x=>{const leg=new THREE.Mesh(new THREE.CapsuleGeometry(.17,1.05,5,10),mat('#45505c'));leg.position.set(x,.47,0);leg.castShadow=true;person.add(leg)});
    const shadow=new THREE.Mesh(new THREE.CircleGeometry(.72,32),new THREE.MeshBasicMaterial({color:'#263d40',transparent:true,opacity:.18,depthWrite:false}));shadow.rotation.x=-Math.PI/2;shadow.position.set(-2.15,.02,1.35);scene.add(shadow);

    const nameNode=document.getElementById('name');nameNode.textContent=roleName+' · 我们的家';nameNode.style.opacity='1';
    document.getElementById('status').remove();
    const clock=new THREE.Clock();
    function render(){
      requestAnimationFrame(render);
      const t=clock.getElapsedTime();
      person.position.y=Math.sin(t*1.7)*.025;
      person.rotation.y=.35+Math.sin(t*.55)*.04;
      armL.rotation.z=-.16+Math.sin(t*1.7)*.025;armR.rotation.z=.16-Math.sin(t*1.7)*.025;
      plant.rotation.y=Math.sin(t*.45)*.06;
      controls.update();renderer.render(scene,camera);
    }
    render();
    function fitCamera(){
      const narrow=innerWidth/innerHeight<.68;
      camera.position.set(...(narrow?[11.8,8.4,17.2]:[8.4,6.7,10.5]));
      controls.target.set(0,1.7,0);controls.update();
    }
    fitCamera();
    addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);fitCamera()});
    window.resetCamera=fitCamera;
    window.toggleHomeLight=()=>{const night=scene.background.getHexString()==='182632';scene.background.set(night?'#9fc6cf':'#182632');scene.fog.color.copy(scene.background);sun.intensity=night?3.1:.75};
  </script>
  <script>
    setTimeout(function(){var status=document.getElementById('status');if(status)status.textContent='3D 引擎加载失败，请检查网络后重试';},12000);
  </script>
</body>
</html>
